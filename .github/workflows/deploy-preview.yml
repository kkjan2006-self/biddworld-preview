name: Deploy isolated BiddWorld visual preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: biddworld-preview-pages
  cancel-in-progress: true
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout preview deployment configuration
        uses: actions/checkout@v4
      - name: Checkout current BiddWorld development branch
        uses: actions/checkout@v4
        with:
          repository: kkjan2006-self/biddworld
          ref: completion-work
          path: app
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install current development dependencies
        working-directory: app
        run: npm ci
      - name: Verify isolated TEST configuration
        shell: bash
        env:
          VITE_SUPABASE_URL: ${{ secrets.BIDDWORLD_TEST_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.BIDDWORLD_TEST_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo "::error::Missing BIDDWORLD_TEST_SUPABASE_URL repository secret."; exit 1; }
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || { echo "::error::Missing BIDDWORLD_TEST_SUPABASE_PUBLISHABLE_KEY repository secret."; exit 1; }
          test "$VITE_SUPABASE_URL" = "https://yoaauthwejdgaevfvwpo.supabase.co" || { echo "::error::Preview must connect only to the isolated TEST Supabase project."; exit 1; }
      - name: Type-check and build current development preview
        working-directory: app
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
          BIDDWORLD_BASE_PATH: '/biddworld-preview/'
          VITE_BIDDWORLD_MODE: test
          VITE_SUPABASE_URL: ${{ secrets.BIDDWORLD_TEST_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.BIDDWORLD_TEST_SUPABASE_PUBLISHABLE_KEY }}
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload preview site
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist
      - name: Publish preview site
        id: deployment
        uses: actions/deploy-pages@v4
